name: Validate VideoEye source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /
      PORT: '5000'
      VIDEOEYE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @workspace/api-server run videoeye:smoke offline
      - run: pnpm --filter @workspace/api-server run videoeye:mcp-smoke
      - run: pnpm --filter @workspace/api-server run videoeye:qwen-normalize-smoke
      - run: pnpm --filter @workspace/api-server run videoeye:inspect-clip-smoke
